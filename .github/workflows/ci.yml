name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        shell: bash
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Tests that call liveDatabaseURL (internal/cli/livedb_test.go) skip unless
  # CAPYDB_CLI_TEST_DATABASE_URL points at a Postgres superuser; they also shell
  # out to psql/pg_dump/pg_restore. Service containers only run on Linux, so
  # they get their own job, and any skip here fails it instead of passing silently.
  test-live-postgres:
    name: Test (live Postgres)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CAPYDB_CLI_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:55432/postgres?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The runner image's preinstalled client is older than the server, and
      # pg_dump refuses to dump a newer server.
      - name: Install Postgres 17 client tools
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Show client versions
        run: |
          psql --version
          pg_dump --version
          pg_restore --version

      # An explicit `shell: bash` runs with pipefail, so a test failure is not
      # masked by tee.
      - name: Run tests against Postgres
        shell: bash
        run: go test -race -count=1 -v ./internal/cli/ 2>&1 | tee live-postgres.log

      - name: Fail on skipped tests
        run: |
          if grep -- '--- SKIP' live-postgres.log; then
            echo "::error::tests skipped in the live Postgres job; they must run here"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        shell: bash
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          VERSION="dev-${GIT_SHA::7}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          GIT_COMMIT=$(git rev-parse --short HEAD)
          go build -v -trimpath \
            -ldflags="-X main.version=${VERSION} -X main.date=${BUILD_DATE} -X main.commit=${GIT_COMMIT} -X main.builtBy=ci" \
            -o capydb \
            ./cmd/capydb

      - name: Verify binary
        run: |
          ./capydb --version
          ./capydb --help

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: capydb-linux-amd64
          path: capydb
          retention-days: 7

  goreleaser:
    name: GoReleaser Check
    runs-on: ubuntu-latest

    env:
      RELEASE_REPO_OWNER: ${{ github.repository_owner }}
      RELEASE_REPO_NAME: ${{ github.event.repository.name }}
      IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/capydb-cli
      REPOSITORY_URL: https://github.com/${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0.24.0

      - name: Check config
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: check

      - name: Test snapshot build
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO_OWNER: ${{ env.RELEASE_REPO_OWNER }}
          RELEASE_REPO_NAME: ${{ env.RELEASE_REPO_NAME }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_REPOSITORY }}
          REPOSITORY_URL: ${{ env.REPOSITORY_URL }}

      - name: Upload snapshot artifacts
        uses: actions/upload-artifact@v7
        with:
          name: snapshot-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/*.spdx.json
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: capydb:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=test
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            GIT_COMMIT=${{ github.sha }}

      - name: Test Docker image
        run: |
          docker run --rm capydb:test --version
          docker run --rm capydb:test --help
