version: 2

project_name: capydb

env:
  - GO111MODULE=on

before:
  hooks:
    - go mod verify
    - go test ./...
    # Generate shell completions so archives and the Homebrew cask can ship them.
    - mkdir -p completions
    - sh -c 'go run ./cmd/capydb completion bash > completions/capydb.bash'
    - sh -c 'go run ./cmd/capydb completion zsh > completions/capydb.zsh'
    - sh -c 'go run ./cmd/capydb completion fish > completions/capydb.fish'

builds:
  - id: capydb
    main: ./cmd/capydb
    binary: capydb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}
      - -X main.builtBy=goreleaser
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README*
      - completions/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Documentation
      regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Performance and Refactors
      regexp: '^.*?(perf|refactor)(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Dependencies
      regexp: '^.*?(build|deps?)(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: Other Changes
      order: 999
  filters:
    exclude:
      - "^chore:"
      - "^style:"
      - "^test:"
      - "^ci:"
      - Merge pull request
      - Merge branch
      - go mod tidy

# Publishes a cask to github.com/capydatabase/homebrew-tap so users can
# `brew tap capydatabase/tap && brew install --cask capydb` (or plain
# `brew install capydatabase/tap/capydb`). Casks are GoReleaser's current
# mechanism for prebuilt binaries (the old `brews` formula section is
# deprecated). The tap repo must exist and the release token needs push
# access to it. Skipped on snapshot builds.
homebrew_casks:
  - name: capydb
    repository:
      owner: capydatabase
      name: homebrew-tap
      branch: main
    directory: Casks
    homepage: https://capydb.dev
    description: "CapyDB CLI - simple Postgres hosting"
    license: MIT
    commit_author:
      name: capydb-release-bot
      email: releases@capydb.dev
    # Shell completions shipped inside the release archives (see archives.files).
    completions:
      bash: completions/capydb.bash
      zsh: completions/capydb.zsh
      fish: completions/capydb.fish
    # Unquarantine the binary on install: release artifacts are not notarized.
    # This goes through custom_block rather than `hooks.post.install` because
    # GoReleaser still emits the `postflight` stanza, which Homebrew deprecated
    # in favour of the declarative `postflight_steps`. Needs Homebrew >= 6.0.12,
    # which is where the step guards (`on_macos`) and `run`'s `chdir:` landed.
    # Paths inside a steps block default to the staged path, so `chdir: "."`
    # lands xattr in the directory holding the binary; do not write
    # `{{staged_path}}` here - GoReleaser re-renders the generated cask and
    # would try to expand it as a template action.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr",
              args: ["-dr", "com.apple.quarantine", "capydb"],
              chdir: ".",
              must_succeed: false
        end
      end
    skip_upload: "{{ .IsSnapshot }}"

release:
  github:
    owner: "{{ .Env.RELEASE_REPO_OWNER }}"
    name: "{{ .Env.RELEASE_REPO_NAME }}"
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## CapyDB CLI {{ .Tag }}

    Install with:

    ```bash
    go install github.com/capydatabase/capydb-cli/cmd/capydb@{{ .Tag }}
    ```
  footer: |
    Download the archive for your platform from the assets below.

dockers_v2:
  - ids:
      - capydb
    dockerfile: Dockerfile.goreleaser
    images:
      - "{{ .Env.IMAGE_REPOSITORY }}"
    tags:
      - "{{ .Version }}"
      - "latest"
      - "{{ .Version }}-amd64"
      - "{{ .Version }}-arm64"
    platforms:
      - linux/amd64
      - linux/arm64
    disable: "{{ or .IsSnapshot (eq .Env.IMAGE_REPOSITORY \"\") }}"
    flags:
      - "--pull"
    labels:
      "org.opencontainers.image.created": "{{ .Date }}"
      "org.opencontainers.image.title": "{{ .ProjectName }}"
      "org.opencontainers.image.revision": "{{ .FullCommit }}"
      "org.opencontainers.image.version": "{{ .Version }}"
      "org.opencontainers.image.source": "{{ .Env.REPOSITORY_URL }}"

sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
